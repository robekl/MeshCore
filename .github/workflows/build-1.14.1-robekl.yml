name: Build 1.14.1-robekl Release Artifacts

on:
  push:
    branches:
      - 1.14.1-robekl
  workflow_dispatch:

jobs:
  build-on-proxmox:
    runs-on: [self-hosted, proxmox, meshcore, pve7600]
    timeout-minutes: 720

    steps:
      - name: Run release build on self-hosted runner
        shell: bash
        run: |
          set -euxo pipefail
          /home/builder/meshcore-build-release.sh 1.14.1-robekl 1.14.1 1.14.1-robekl
